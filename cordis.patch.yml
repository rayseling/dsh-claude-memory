# dsh-claude-memory bundle patch: one server row and one web client bundle, no services.
# Override `config` from the profile's own cordis.patch.yml by addressing the
# same id; removing the dependency removes the row.
- insert:
    - id: claude-memory
      name: dsh-claude-memory
      config:
        # claudeHome: ~/.claude          Claude Code config directory
        # maxLines: 200                  Claude Code's own index cap
        # maxChars: 25000                Claude Code's own index cap
        # includeSubagents: false        Claude Code gives subagents no memory
        # enabledByDefault: false        switch position before /memory on|off; true loads like Claude Code
        {}
